<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squirrel Archer Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: rgba(14, 20, 38, 0.86);
    --gold: #e3c27a;
    --gold-dim: #9c8150;
    --text: #f6efdc;
    --muted: #c9bea4;
    --px: 'Pixelify Sans', 'Silkscreen', 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; background: #121a2e; overflow: hidden; color: var(--text); font-family: var(--px); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }

  .hud { position: fixed; pointer-events: none; transition: opacity .3s; }
  body.hud-hidden .hud { opacity: 0; }
  .title { left: max(16px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 14px); text-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .title h1 { margin: 0; font-size: clamp(18px, 2.4vw, 24px); font-weight: 600; letter-spacing: .02em; }
  .title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .tod { right: max(16px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    font: 400 14px/1 var(--px); color: var(--text); background: var(--ink);
    border: 2px solid var(--gold-dim); border-radius: 4px; padding: 7px 10px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.5);
  }
  .btn[aria-pressed="true"] { border-color: var(--gold); color: #fff6d8; }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .keys { left: max(16px, env(safe-area-inset-left)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); color: var(--muted); font-size: 13px; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
  .keys b { color: var(--text); font-weight: 600; }

  #prompt {
    position: fixed; left: 0; top: 0; pointer-events: none;
    font: 600 13px/1 var(--px); color: #1a1408; background: var(--gold); padding: 4px 7px; border-radius: 3px;
    box-shadow: 0 2px 0 #6e5628;
  }
  #prompt::after { content: ''; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--gold); border-bottom: 0; }

  #dialog {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    width: min(760px, calc(100% - 32px)); box-sizing: border-box;
    background: linear-gradient(180deg, rgba(22,30,56,.94), rgba(12,17,34,.94));
    border: 2px solid var(--gold); border-radius: 6px;
    box-shadow: 0 0 0 2px #0c1120, inset 0 0 0 2px rgba(227,194,122,.25), 0 8px 24px rgba(0,0,0,.4);
    padding: 20px 22px 18px; font-size: clamp(16px, 2.1vw, 20px); line-height: 1.45;
  }
  #dialog-name {
    position: absolute; top: -14px; left: 18px; background: #0c1120; border: 2px solid var(--gold);
    padding: 3px 10px; border-radius: 4px; font-size: 14px; color: var(--gold); letter-spacing: .03em;
  }
  #dialog-text { margin: 0; min-height: 2.9em; max-width: 64ch; }
  #dialog .more { position: absolute; right: 16px; bottom: 10px; color: var(--gold); opacity: 0; font-size: 14px; }
  #dialog.done .more { opacity: 1; animation: nudge 1s steps(2) infinite; }
  @keyframes nudge { 50% { transform: translateY(2px); } }
  @media (prefers-reduced-motion: reduce) { #dialog.done .more { animation: none; } }
  @media (max-width: 560px) { .keys { display: none; } .title p { display: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud title">
  <h1>Squirrel Archer</h1>
  <p>HD-2D prototype · every sprite and tile drawn in code</p>
</div>

<div class="hud tod" role="group" aria-label="Time of day">
  <button class="btn" type="button" data-tod="morning">Morning</button>
  <button class="btn" type="button" data-tod="golden">Golden hour</button>
  <button class="btn" type="button" data-tod="night">Night</button>
  <button class="btn" type="button" id="hud-toggle" title="Hide the overlay">Hide</button>
</div>

<div class="hud keys"><b>WASD</b> / arrows or hold to walk · <b>E</b> / space or tap to talk</div>

<div id="prompt" hidden>Talk</div>

<div id="dialog" hidden aria-live="polite">
  <div id="dialog-name">Name</div>
  <p id="dialog-text"></p>
  <span class="more">▼</span>
</div>

<div id="loading" style="position:fixed;inset:0;display:grid;place-items:center;background:#121a2e;font-size:18px;color:#c9bea4">Drawing sprites…</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
